[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-prompt-builder"
version = "0.1.0"
description = "Composable system prompt builder for LLM agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Tests use the standard-library ``unittest`` runner, so no test framework is
# required: run ``python -m unittest discover -s tests``. The dev extra only
# provides the linter.
dev = ["ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_prompt_builder"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_prompt_builder/py.typed" = "agent_prompt_builder/py.typed"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
